<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فائض</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f7f6f2; color: #171717; font-family: Arial, Tahoma, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { max-width: 360px; width: 100%; background: #fff; border: 1px solid #e8e6df; border-radius: 24px; padding: 32px; text-align: center; }
  .logo { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .logo span { color: #b98b42; }
  p { color: #737373; line-height: 1.9; font-size: 15px; }
  button { width: 100%; background: #173f35; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; font-family: inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">فائض<span>.</span></div>
    <p>ما قدرنا نفتح فائض. تأكد من الاتصال بالإنترنت وحاول مرة ثانية.</p>
    <button onclick="location.href = (window.Capacitor && Capacitor.getServerUrl && Capacitor.getServerUrl()) || '/'">حاول مرة ثانية</button>
  </div>
</body>
</html>
